# BaiduPCS-Rust 服务配置（/etc/config/baidupcs-rust）
#
# 管理入口说明：
#  * 本文件驱动 init.d 启动脚本（procd 守护、开机自启、防火墙规则），
#    并用于首次启动时生成 <workdir>/config/app.toml；
#  * 之后程序自身的所有运行时选项（账号会话、任务、Web 认证/TOTP、
#    自动备份、分享同步、消息通知等）都由其 Web 管理界面或 app.toml 承载，
#    Web 界面会直接写回 app.toml，故生成动作默认只在文件缺失时执行；
#  * 如需用 UCI 覆盖 app.toml，可执行：
#      /etc/init.d/baidupcs-rust regenerate && /etc/init.d/baidupcs-rust restart
#    （注意：regenerate 会覆盖 app.toml 中 Web 界面已保存的设置）

config baidupcs 'main'
	# 是否开机自启并随 procd 守护（0/1）
	option enabled '0'

	# 运行时工作目录（需位于可写分区；与 menuconfig 中
	# BAIDUPCS_RUST_WORKDIR 保持一致）
	option workdir '/opt/baidupcs-rust'

	# [server] 监听地址与端口（仅首次生成 app.toml 时生效）
	option host '0.0.0.0'
	option port '18888'

	# 日志级别：error|warn|info|debug|trace（透传给 RUST_LOG）
	option log_level 'info'

	# [download] 下载目录（建议指向 USB 硬盘/extroot，
	# 如 /mnt/sda1/downloads）
	option download_dir '/opt/baidupcs-rust/downloads'

	# [download] 并发分片数（建议 4-16）、分片大小 MB、失败重试次数
	option concurrent_chunks '8'
	option chunk_size_mb '10'
	option max_retries '3'

	# [filesystem] 上传选择器默认目录与白名单目录列表
	# （allowed_paths 为空表示不限制本机浏览范围）
	option fs_default_path '/opt/baidupcs-rust/downloads'
	list fs_allowed_paths '/mnt'

	# 是否向 WAN 开放 Web 端口（默认关闭；强烈建议仅在受信内网使用，
	# 如需公网访问请配合 Web 界面中的访问密码/TOTP 并改用反代+HTTPS）
	option expose_wan '0'
